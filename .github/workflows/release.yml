name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Unshallow: make dist takes the version from git describe, which needs the tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: sudo apt-get update && sudo apt-get install -y zsh

      - run: go test ./...

      # The tag's own commit date, so re-running this workflow rebuilds byte-identically.
      - name: Build the archives
        run: make dist DATE="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"

      # A -dirty or hash-shaped version means the archives are named after something
      # other than this tag, and the release would ship them under the tag's name.
      - name: Check what the binaries report
        run: |
          tar -xzf "dist/urd_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C /tmp urd
          /tmp/urd --version
          /tmp/urd --version | grep -q "^${GITHUB_REF_NAME} ("

      - name: Render the Homebrew formula
        run: sh packaging/formula.sh "$GITHUB_REF_NAME" dist > dist/urd.rb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt dist/urd.rb

      # Skipped entirely until the repository variable HOMEBREW_TAP names a tap
      # (owner/homebrew-something) and the secret HOMEBREW_TAP_TOKEN can push to it.
      - name: Update the Homebrew tap
        if: vars.HOMEBREW_TAP != ''
        env:
          TAP: ${{ vars.HOMEBREW_TAP }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          cp dist/urd.rb tap/Formula/urd.rb
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/urd.rb
          git -C tap diff --cached --quiet && exit 0
          git -C tap commit -m "urd $GITHUB_REF_NAME"
          git -C tap push
