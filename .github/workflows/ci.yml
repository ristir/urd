name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor the module declares, and what apt ships on 24.04.
          - os: ubuntu-latest
            go: "1.22"
          # Not 1.22 here: its external linker leaves LC_UUID out of the test binary
          # on the macOS 15 runner, and dyld aborts before a test runs.
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      # The widget tests drive a real zsh through a pty; the ubuntu runner ships none.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...
